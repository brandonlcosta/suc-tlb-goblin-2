<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUC: The Long Burn</title>
  </head>
  <body>
    <main id="app">
      <section id="game-shell" aria-label="SUC: The Long Burn prototype">
        <canvas
          id="game-canvas"
          width="320"
          height="180"
          aria-label="SUC: The Long Burn prototype canvas"
        ></canvas>
        <div id="hud" aria-live="polite">
          <div>
            <strong>SUC: THE LONG BURN</strong>
            <span>CAL STREET HEAT DROP</span>
          </div>
          <div class="meter-row" aria-label="Survival resources">
            <span data-hud-pace>PACE 2 STEADY</span>
            <span data-hud-time>TIME 00:00</span>
            <span data-hud-heat>HEAT 018</span>
            <span data-hud-cooling>ICE READY 1</span>
            <span data-hud-hydration>HYDRATION 100</span>
            <span data-hud-quad>QUADS 000</span>
            <span data-hud-crew>CREW OPEN</span>
          </div>
          <div>
            <span data-hud-progress>PROGRESS 000%</span>
            <span data-hud-status>A/D STEER  R RESTART</span>
          </div>
        </div>
        <div id="crew-overlay" aria-label="Foresthill crew zone">
          <div class="crew-panel">
            <strong>FORESTHILL CREW ZONE</strong>
            <span data-crew-message>Two quick crew calls. Then the canyon collects.</span>
            <div class="crew-actions" aria-label="Crew actions">
              <button type="button" data-crew-action="refill">
                <strong>Refill bottles</strong>
                <span>Hydration restored. Costs time.</span>
              </button>
              <button type="button" data-crew-action="ice">
                <strong>Ice bandana</strong>
                <span>Adds cooling charge. Costs time.</span>
              </button>
              <button type="button" data-crew-action="water">
                <strong>Water dump</strong>
                <span>Drops heat now. Small time cost.</span>
              </button>
              <button type="button" data-crew-action="gels">
                <strong>Grab gels</strong>
                <span>Early fuel support. Costs time.</span>
              </button>
              <button type="button" data-crew-action="calm">
                <strong>Calm down</strong>
                <span>Cleaner early descent. Costs time.</span>
              </button>
              <button type="button" data-crew-action="leave">
                <strong>Leave fast</strong>
                <span>Save time. Carry the risk.</span>
              </button>
            </div>
            <span data-crew-counter>2 crew picks available</span>
          </div>
        </div>
      </section>
      <button id="restart-button" type="button">Restart</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
